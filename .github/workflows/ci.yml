# FarmSmart — CI workflow
#
# Runs seven jobs on every push to `main` and on every pull request. Six jobs
# (quality, node-tests, database-integration, recommender, dependency-audit,
# blueprint) run in parallel; the seventh (`required`) is an aggregate gate
# that branches protection can require.
#
# Pinned to exact tool versions and immutable action SHAs for reproducibility
# and supply-chain hardening:
#   - Runner:   ubuntu-24.04
#   - Node:     22.23.2
#   - pnpm:     11.17.0  (also declared in package.json#packageManager)
#   - Supabase: 2.109.1  (from devDependencies)
#   - uv:       0.11.26
#   - Render:   2.22.0   (checksum-verified)

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.2"
  PNPM_VERSION: "11.17.0"
  UV_VERSION: "0.11.26"

jobs:
  # ── 1. quality ────────────────────────────────────────────────────────────
  # Codegen drift check + workspace-wide typecheck. Fails if generated API
  # clients are out of sync with the OpenAPI spec.
  quality:
    name: Quality (codegen + typecheck)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate API clients
        run: pnpm --filter @workspace/api-spec run codegen
      - name: Verify generated outputs are committed
        run: git diff --exit-code -- lib/api-client-react/src/generated lib/api-zod/src/generated
      - name: Typecheck
        run: pnpm run typecheck

  # ── 2. node-tests ─────────────────────────────────────────────────────────
  # Node.js test suites that do NOT require a live database. The api-server
  # suite that hits Postgres lives in `database-integration` instead.
  node-tests:
    name: Node.js tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run api-server tests
        run: pnpm --filter @workspace/api-server run test
      - name: Run farmeasy tests
        run: pnpm --filter @workspace/farmeasy run test

  # ── 3. database-integration ───────────────────────────────────────────────
  # Replays the full migration history into a disposable local Supabase stack
  # and runs the pgTAP + api-server suites against it. The script sets
  # REQUIRE_TEST_DATABASE=true and tears the instance down via trap on exit.
  database-integration:
    name: Database integration (disposable Supabase)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies (pins Supabase CLI 2.109.1)
        run: pnpm install --frozen-lockfile
      - name: Replay migrations + run DB-gated tests
        run: bash scripts/ci/test-disposable-supabase.sh

  # ── 4. recommender ────────────────────────────────────────────────────────
  # Python pytest for the FastAPI recommender service, managed by uv.
  recommender:
    name: Recommender (pytest)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
      - name: Sync recommender environment
        run: uv sync --directory artifacts/recommender-svc --locked
      - name: Run pytest
        run: uv run --directory artifacts/recommender-svc pytest -v

  # ── 5. dependency-audit ───────────────────────────────────────────────────
  # Generates npm + Python audit reports and uploads them as artifacts. The
  # audit commands themselves are non-blocking (|| true), so this job always
  # passes even if vulnerabilities are found — Task 6 will gate on findings
  # once remediation lands.
  dependency-audit:
    name: Dependency audit (reports only)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
      - name: npm audit (non-blocking)
        run: pnpm audit --prod --json > npm-audit.json || true
      - name: Export Python requirements
        run: uv export --directory artifacts/recommender-svc --locked --no-dev --format requirements.txt --output-file recommender-requirements.txt
      - name: pip-audit (non-blocking)
        run: uvx --from pip-audit pip-audit -r recommender-requirements.txt -f json -o python-audit.json || true
      - name: Upload audit reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-audit-reports
          path: |
            npm-audit.json
            python-audit.json
          if-no-files-found: warn
          retention-days: 30

  # ── 6. blueprint ──────────────────────────────────────────────────────────
  # Validates render.yaml with the checksum-pinned Render CLI.
  blueprint:
    name: Render blueprint validation
    runs-on: ubuntu-24.04
    env:
      RENDER_VERSION: "2.22.0"
      RENDER_SHA256: "6cdcd11897b7bd7e673317e6f4aaf041b654d818444f3b1efec7240a835f79ec"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Render CLI (checksum-verified)
        run: |
          curl -fsSLo /tmp/render.zip "https://github.com/render-oss/cli/releases/download/v${RENDER_VERSION}/cli_${RENDER_VERSION}_linux_amd64.zip"
          echo "${RENDER_SHA256}  /tmp/render.zip" | sha256sum -c -
          unzip -q /tmp/render.zip -d /tmp/render-cli
          sudo install /tmp/render-cli/cli_v${RENDER_VERSION} /usr/local/bin/render
      - name: Validate render.yaml
        env:
          RENDER_WORKSPACE_ID: ${{ secrets.RENDER_WORKSPACE_ID }}
        run: render blueprints validate render.yaml --workspace "$RENDER_WORKSPACE_ID" --confirm -o text

  # ── 7. required ───────────────────────────────────────────────────────────
  # Single aggregate gate for branch protection. Runs after all six jobs and
  # fails if any of them failed or were cancelled. `if: always()` ensures it
  # executes even when an upstream job fails (otherwise the gate could be
  # silently skipped, defeating branch protection).
  required:
    name: Required (all jobs passed)
    runs-on: ubuntu-24.04
    needs:
      - quality
      - node-tests
      - database-integration
      - recommender
      - dependency-audit
      - blueprint
    if: always()
    steps:
      - name: Verify all upstream jobs succeeded
        run: |
          echo "quality=${{ needs.quality.result }}"
          echo "node-tests=${{ needs.node-tests.result }}"
          echo "database-integration=${{ needs.database-integration.result }}"
          echo "recommender=${{ needs.recommender.result }}"
          echo "dependency-audit=${{ needs.dependency-audit.result }}"
          echo "blueprint=${{ needs.blueprint.result }}"
          for r in \
            "${{ needs.quality.result }}" \
            "${{ needs.node-tests.result }}" \
            "${{ needs.database-integration.result }}" \
            "${{ needs.recommender.result }}" \
            "${{ needs.dependency-audit.result }}" \
            "${{ needs.blueprint.result }}" ; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::Upstream job ended with '$r'; required gate fails."
              exit 1
            fi
          done
          echo "All required jobs passed."
