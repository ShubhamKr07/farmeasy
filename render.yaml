# FarmSmart — Render infrastructure-as-code
# Docs: https://render.com/docs/blueprint-spec
#
# Six services (production + staging pair each):
#   1. farmsmart-api          — Express API (Web Service, $7/mo starter)
#   2. farmsmart-dashboard    — admin SPA (Web Service, vite preview)
#   3. farmsmart-recommender  — Python/FastAPI recommender (Web Service, $7/mo starter)
#   4. farmsmart-api-staging          — staging mirror of the API
#   5. farmsmart-dashboard-staging    — staging mirror of the dashboard
#   6. farmsmart-recommender-staging  — staging mirror of the recommender
# Postgres is external (Supabase) — set DATABASE_URL (transaction pooler).
# Auth is Supabase Auth.
#
# Staging services deploy from branch: main with autoDeployTrigger: off (SHA-gated
# promotion per ADR-004). Production services also have autoDeployTrigger: off —
# deploys are driven by the promotion workflow, not by pushes to main.
#
# FIRST-DEPLOY ORDER:
#   1. Deploy the API service; note its URL (Render assigns <name>.onrender.com,
#      suffixed if the bare name is taken, e.g. https://farmsmart-api-j3qt.onrender.com).
#   2. Set the dashboard's VITE_API_BASE_URL env var to that API URL.
#   3. Set the API's CORS_ORIGINS env var to a comma-separated list of allowed
#      dashboard origins (e.g. https://farmsmart-dashboard.onrender.com), and
#      set DASHBOARD_URL to the dashboard base URL the QuickBooks callback
#      redirects to. In production (NODE_ENV=production) the API will refuse to
#      start unless CORS_ORIGINS is set.
#   4. Add both URLs to Supabase Auth's allowed redirect URLs (if needed).
#   5. Deploy the dashboard service.

services:
  # ── API server (production) ───────────────────────────────────────────────
  - type: web
    name: farmsmart-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm i -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/readyz
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Supabase transaction-pooler connection string (port 6543) — see ADR-003
      - key: DATABASE_CA_CERT
        sync: false # PEM-encoded "Supabase Root 2021 CA" that pins TLS for the
                     # Postgres connection (Release 1 Task 10). Same shared
                     # public root for every Supabase project; the GitHub
                     # Actions secret PRODUCTION_DATABASE_CA_CERT holds the
                     # identical bytes. NOTE: declaring it here does NOT set it
                     # on the live Render service — a code-only Blueprint
                     # deploy never syncs envVars (Task 9 hit this exact gap);
                     # the orchestrator must apply the live value separately.
      - key: SUPABASE_URL
        value: https://meorgbbtxlpzxyfxmnyu.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Project Settings -> API -> service_role key (server-side only, never exposed to clients)
      - key: CORS_ORIGINS
        sync: false # comma-separated list of allowed dashboard origins, e.g.
                     # https://farmsmart-dashboard.onrender.com (add staging/preview origins as needed)
      - key: DASHBOARD_URL
        sync: false # dashboard base URL the QuickBooks OAuth callback redirects to, e.g.
                     # https://farmsmart-dashboard.onrender.com (distinct from CORS_ORIGINS)
      - key: TRUST_PROXY_HOPS
        value: "1" # Render runs the API single-hop behind its edge proxy; req.ip (and the
                    # IP-keyed recommendation rate limiter) is only trustworthy when Express
                    # is told exactly how many proxy hops to honor for X-Forwarded-For.
      - key: FACILITY_TIMEZONE
        value: America/New_York # §1.5 rule 1 — facility-local date_trunc / window bounds
      - key: QBO_CLIENT_ID
        sync: false # Intuit Developer app Client ID (sandbox or production)
      - key: QBO_CLIENT_SECRET
        sync: false # Intuit Developer app Client Secret
      - key: QBO_REDIRECT_URI
        sync: false # must exactly match a Redirect URI listed in the Intuit app's
                     # Keys & OAuth settings, e.g. https://farmsmart-api-j3qt.onrender.com/api/accounting/callback
      - key: QBO_ENVIRONMENT
        value: sandbox # "sandbox" or "production" — switch only after end-to-end testing
      - key: ACCOUNTING_ENCRYPTION_KEY
        sync: false # random 32+ char secret for AES-256-GCM token-at-rest encryption
                     # generate once with: openssl rand -base64 32
      - key: RECOMMENDER_URL
        sync: false # farmsmart-recommender's internal Render URL, e.g.
                     # https://farmsmart-recommender.onrender.com
      - key: RECOMMENDER_INTERNAL_KEY
        sync: false # shared secret with farmsmart-recommender's INTERNAL_API_KEY —
                     # generate once with: openssl rand -base64 32 (same value on both services)

  # ── Admin dashboard SPA (production, Web Service, vite preview) ───────────
  # Served via `vite preview` (SPA fallback handled by vite's default appType=spa).
  # Free web service spins down after inactivity; first hit re-awakens (~30s).
  - type: web
    name: farmsmart-dashboard
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm i -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @workspace/admin-dashboard run build
    startCommand: pnpm --filter @workspace/admin-dashboard serve
    healthCheckPath: /
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000" # vite.config requires PORT at build time; Render injects runtime PORT
      - key: BASE_PATH
        value: / # SPA served at root
      - key: VITE_API_BASE_URL
        sync: false # API URL, e.g. https://farmsmart-api-j3qt.onrender.com
      - key: VITE_SUPABASE_URL
        value: https://meorgbbtxlpzxyfxmnyu.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false # Project Settings -> API -> anon/public key

  # ── Recommender (production, Python/FastAPI, dlt ingestion + pgvector) ────
  # Talks to the same Supabase Postgres as farmsmart-api (DATABASE_URL). Only
  # farmsmart-api calls this service directly (INTERNAL_API_KEY-gated) — it
  # is not exposed to the dashboard or the public internet.
  - type: web
    name: farmsmart-recommender
    runtime: python
    plan: starter
    region: oregon
    buildCommand: cd artifacts/recommender-svc && pip install uv && uv sync --frozen
    startCommand: cd artifacts/recommender-svc && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        sync: false # same Supabase transaction-pooler string as farmsmart-api (port 6543)
      - key: DATABASE_URL_DIRECT
        sync: false # Supabase session-pooler string (port 5432) — dlt/psycopg2 ingestion only, see ADR-003
      - key: GEMINI_API_KEY
        sync: false # aistudio.google.com — used for gemini-embedding-001 (embeddings)
                     # and gemini-2.5-flash (answer synthesis) — one provider, one key
      - key: TAVILY_API_KEY
        sync: false # tavily.com — live search on a cache miss (free tier: 1,000 credits/mo)
      - key: INTERNAL_API_KEY
        sync: false # shared secret with farmsmart-api's RECOMMENDER_INTERNAL_KEY —
                     # same value as that key, generated once via: openssl rand -base64 32

  # ── API server (staging) ──────────────────────────────────────────────────
  # Mirror of farmsmart-api. SHA-gated promotion from branch: main; autodeploy
  # is off so only the promotion workflow can trigger a deploy (ADR-004).
  - type: web
    name: farmsmart-api-staging
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/ShubhamKr07/farmsmart
    branch: main
    autoDeployTrigger: off
    buildCommand: npm i -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # staging Supabase transaction-pooler connection string (port 6543)
      - key: DATABASE_CA_CERT
        sync: false # PEM-encoded "Supabase Root 2021 CA" that pins TLS for the
                     # Postgres connection (Release 1 Task 10). Same shared
                     # public root for every Supabase project; the GitHub
                     # Actions secret STAGING_DATABASE_CA_CERT holds the
                     # identical bytes. NOTE: declaring it here does NOT set it
                     # on the live Render service — a code-only Blueprint
                     # deploy never syncs envVars (Task 9 hit this exact gap);
                     # the orchestrator must apply the live value separately.
      - key: SUPABASE_URL
        value: https://jkxlbndnatkxmhpumvhh.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # staging Project Settings -> API -> service_role key (server-side only)
      - key: CORS_ORIGINS
        sync: false # comma-separated list of allowed staging dashboard origins — set after
                     # farmsmart-dashboard-staging URL is known
      - key: DASHBOARD_URL
        sync: false # staging dashboard base URL the QuickBooks OAuth callback redirects to —
                     # set after farmsmart-dashboard-staging URL is known
      - key: TRUST_PROXY_HOPS
        value: "1" # staging API is also single-hop behind Render's edge proxy (same as prod)
      - key: FACILITY_TIMEZONE
        value: America/New_York # §1.5 rule 1 — facility-local date_trunc / window bounds
      - key: QBO_CLIENT_ID
        sync: false # QBO_* vars can stay unset for staging until QuickBooks integration testing
      - key: QBO_CLIENT_SECRET
        sync: false # QBO_* vars can stay unset for staging until QuickBooks integration testing
      - key: QBO_REDIRECT_URI
        sync: false # QBO_* vars can stay unset for staging until QuickBooks integration testing
      - key: QBO_ENVIRONMENT
        value: sandbox # "sandbox" or "production"
      - key: ACCOUNTING_ENCRYPTION_KEY
        sync: false # random 32+ char secret for AES-256-GCM token-at-rest encryption
      - key: RECOMMENDER_URL
        sync: false # staging farmsmart-recommender URL — set after farmsmart-recommender-staging URL is known
      - key: RECOMMENDER_INTERNAL_KEY
        sync: false # shared secret with farmsmart-recommender-staging's INTERNAL_API_KEY

  # ── Admin dashboard SPA (staging) ─────────────────────────────────────────
  # Mirror of farmsmart-dashboard. SHA-gated promotion from branch: main.
  - type: web
    name: farmsmart-dashboard-staging
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/ShubhamKr07/farmsmart
    branch: main
    autoDeployTrigger: off
    buildCommand: npm i -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @workspace/admin-dashboard run build
    startCommand: pnpm --filter @workspace/admin-dashboard serve
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000" # vite.config requires PORT at build time; Render injects runtime PORT
      - key: BASE_PATH
        value: / # SPA served at root
      - key: VITE_API_BASE_URL
        sync: false # staging API URL — set after farmsmart-api-staging URL is known
      - key: VITE_SUPABASE_URL
        value: https://jkxlbndnatkxmhpumvhh.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false # staging Project Settings -> API -> anon/public key

  # ── Recommender (staging, Python/FastAPI, dlt ingestion + pgvector) ───────
  # Mirror of farmsmart-recommender. SHA-gated promotion from branch: main.
  - type: web
    name: farmsmart-recommender-staging
    runtime: python
    plan: starter
    region: oregon
    repo: https://github.com/ShubhamKr07/farmsmart
    branch: main
    autoDeployTrigger: off
    buildCommand: cd artifacts/recommender-svc && pip install uv && uv sync --frozen
    startCommand: cd artifacts/recommender-svc && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false # staging Supabase transaction-pooler string (port 6543)
      - key: DATABASE_URL_DIRECT
        sync: false # staging Supabase session-pooler string (port 5432) — dlt/psycopg2 ingestion only
      - key: GEMINI_API_KEY
        sync: false # aistudio.google.com — embeddings + answer synthesis
      - key: TAVILY_API_KEY
        sync: false # tavily.com — live search on a cache miss
      - key: INTERNAL_API_KEY
        sync: false # shared secret with farmsmart-api-staging's RECOMMENDER_INTERNAL_KEY
