openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: FarmEasy API - Indoor farm cycle management
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard stats
  - name: cycles
    description: Crop cycle operations
  - name: growth-profiles
    description: Growth profile master data
  - name: seed-lots
    description: Seed lot lookup
  - name: alerts
    description: Alert management
  - name: inventory
    description: Inventory management
  - name: shipments
    description: Shipment tracking
  - name: bad-trays
    description: Bad tray analysis
  - name: media
    description: Photo upload and signed-URL resolution
  - name: layout
    description: Facility layout management
  - name: facilities
    description: Onboarding wizard facility creation and existence check
  - name: wizard
    description: Onboarding wizard resume/progress tracking
  - name: sensor-accounts
    description: Vendor sensor account credentials and connection testing
  - name: wizard-events
    description: WIZ-006 fire-and-forget onboarding wizard step telemetry (view/save/abandon/skip)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: >
        Process-liveness probe (mobile clients poll this). Zero I/O — returns
        200/{status:"ok"} as long as the Node process can answer, regardless of
        database reachability, so a DB blip never looks like a process crash.
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check (database reachable)
      description: >
        Runs SELECT 1 against the database with a 2-second budget. Returns
        200/{status:"ok"} when it answers within budget, 503 otherwise.
        Distinct from /healthz: Render routes traffic on this (its
        healthCheckPath), so a DB-down instance is pulled from the load pool
        while the Node process keeps answering /healthz for mobile.
      responses:
        "200":
          description: Database reachable within the 2s budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database not reachable within the 2s budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /growth-profiles:
    get:
      operationId: listGrowthProfiles
      tags: [growth-profiles]
      summary: List all growth profiles
      responses:
        "200":
          description: List of growth profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GrowthProfile"

  /seed-lots/lookup:
    get:
      operationId: lookupSeedLot
      tags: [seed-lots]
      summary: Look up a seed lot by QR code
      parameters:
        - name: qrCode
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Seed lot found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeedLot"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cycles:
    get:
      operationId: listCycles
      tags: [cycles]
      summary: List cycles
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ongoing, history]
            default: ongoing
      responses:
        "200":
          description: List of cycles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cycle"
    post:
      operationId: createCycle
      tags: [cycles]
      summary: Create a new cycle (seeding)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCycleRequest"
      responses:
        "201":
          description: Cycle created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cycle"

  /cycles/{id}:
    get:
      operationId: getCycle
      tags: [cycles]
      summary: Get cycle detail with manual checks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cycle detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cycles/{id}/fertigation:
    post:
      operationId: moveCycleToFertigation
      tags: [cycles]
      summary: Move cycle from germination to fertigation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveFertigationRequest"
      responses:
        "200":
          description: Cycle moved to fertigation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cycle"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cycles/{id}/harvest:
    post:
      operationId: completeCycleHarvest
      tags: [cycles]
      summary: Complete harvest for a cycle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteHarvestRequest"
      responses:
        "200":
          description: Cycle harvest completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cycle"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cycles/{id}/manual-checks:
    get:
      operationId: listManualChecks
      tags: [cycles]
      summary: List manual checks for a cycle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of manual checks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManualCheck"
    post:
      operationId: createManualCheck
      tags: [cycles]
      summary: Create a manual check for a cycle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateManualCheckRequest"
      responses:
        "201":
          description: Manual check created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualCheck"

  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List alerts by status
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [current, resolved, dismissed]
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"
    post:
      operationId: createAlert
      tags: [alerts]
      summary: Create a new alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertInput"
      responses:
        "201":
          description: Alert created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /alerts/{id}:
    patch:
      operationId: updateAlertStatus
      tags: [alerts]
      summary: Resolve or dismiss an alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertStatusUpdate"
      responses:
        "200":
          description: Alert updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /alerts/{id}/action:
    post:
      operationId: takeAlertAction
      tags: [alerts]
      summary: Take action on an alert (resolves it)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertActionInput"
      responses:
        "200":
          description: Alert resolved with action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List inventory items
      responses:
        "200":
          description: List of inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
    post:
      operationId: createInventoryItem
      tags: [inventory]
      summary: Create an inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemInput"
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"

  /inventory/{id}:
    patch:
      operationId: updateInventoryItem
      tags: [inventory]
      summary: Update an inventory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemUpdate"
      responses:
        "200":
          description: Item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteInventoryItem
      tags: [inventory]
      summary: Delete an inventory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Item deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shipments:
    get:
      operationId: listShipments
      tags: [shipments]
      summary: List shipments
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [in_progress, complete, pending]
        - name: client
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of shipments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shipment"
    post:
      operationId: createShipment
      tags: [shipments]
      summary: Create a shipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentInput"
      responses:
        "201":
          description: Shipment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"

  /shipments/{id}:
    patch:
      operationId: updateShipment
      tags: [shipments]
      summary: Update a shipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentUpdate"
      responses:
        "200":
          description: Shipment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteShipment
      tags: [shipments]
      summary: Delete a shipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Shipment deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shipments/{id}/status:
    patch:
      operationId: updateShipmentStatus
      tags: [shipments]
      summary: Update shipment status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentStatusUpdate"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bad-trays:
    get:
      operationId: getBadTraysAnalysis
      tags: [bad-trays]
      summary: Get bad trays analysis with aggregated issues and manual entries
      responses:
        "200":
          description: Bad trays analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadTraysAnalysis"

  /bad-trays/manual-checks:
    post:
      operationId: createBadTrayEntry
      tags: [bad-trays]
      summary: Create a bad tray manual check entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BadTrayEntryInput"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualCheck"

  /media/upload:
    post:
      operationId: uploadMedia
      tags: [media]
      summary: Upload a photo, returning its stored key and a signed URL
      description: >
        Stores the file under a bucket-relative key (media/<file>) and
        returns both `key` (the permanent, stable reference to persist —
        e.g. in a manual check's or facility log's photoUrls) and `url`
        (a signed URL valid for one hour, for immediate display). Request
        body is multipart/form-data with a single `file` field — not
        modeled as a strict schema here since this endpoint is never
        called through the generated client (mobile builds its own
        FormData and posts it directly via customFetch); modeling
        `format: binary` triggers a File/Blob type reference that doesn't
        resolve in this Node-target codegen output.
      responses:
        "200":
          description: Upload succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadResponse"

  /layout:
    get:
      operationId: getLayout
      tags: [layout]
      summary: Get full facility layout (rooms → channels → racks → trays)
      responses:
        "200":
          description: Full layout
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomItem"

  /layout/channels:
    post:
      operationId: createChannel
      tags: [layout]
      summary: Create a channel in a room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelInput"
      responses:
        "201":
          description: Channel created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelItem"

  /layout/channels/{id}:
    patch:
      operationId: updateChannel
      tags: [layout]
      summary: Rename or reorder a channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelInput"
      responses:
        "200":
          description: Channel updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelItem"
    delete:
      operationId: deleteChannel
      tags: [layout]
      summary: Delete a channel (cascades racks/trays)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Channel deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /layout/channels/{id}/monitoring:
    patch:
      operationId: updateChannelMonitoring
      tags: [layout]
      summary: Save monitoring API URLs for a channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitoringApiInput"
      responses:
        "200":
          description: Monitoring config updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelMonitoringItem"

  /layout/racks:
    post:
      operationId: createRack
      tags: [layout]
      summary: Create a rack in a channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRackInput"
      responses:
        "201":
          description: Rack created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RackItem"

  /layout/resolve:
    get:
      operationId: resolveLayoutQr
      tags: [layout]
      summary: Resolve a layout QR payload to channel monitoring config
      parameters:
        - name: room
          in: query
          required: true
          schema:
            type: string
          description: Room name (seeding, fertigation, harvesting)
        - name: channel
          in: query
          required: true
          schema:
            type: string
          description: Channel label
        - name: rack
          in: query
          required: false
          schema:
            type: string
          description: Optional rack label
      responses:
        "200":
          description: Resolved channel monitoring config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelResolved"
        "404":
          description: Room or channel not found

  /layout/channels-status:
    get:
      operationId: getChannelsStatus
      tags: [layout]
      summary: Tray-position availability for every channel (Phase 7 Channel Utilization panel)
      responses:
        "200":
          description: Per-channel tray availability, every room/channel in one call
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelResolved"

  /layout/racks/{id}/tray-count:
    patch:
      operationId: setRackTrayCount
      tags: [layout]
      summary: Set the number of trays in a rack (creates or deletes to match target count)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTrayCountInput"
      responses:
        "200":
          description: Tray count updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrayCountResult"

  /layout/racks/{id}:
    patch:
      operationId: updateRack
      tags: [layout]
      summary: Rename or reorder a rack
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRackInput"
      responses:
        "200":
          description: Rack updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RackItem"
    delete:
      operationId: deleteRack
      tags: [layout]
      summary: Delete a rack (cascades trays)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rack deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /layout/trays:
    post:
      operationId: createTray
      tags: [layout]
      summary: Create a tray in a rack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTrayInput"
      responses:
        "201":
          description: Tray created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrayItem"

  /layout/trays/{id}:
    delete:
      operationId: deleteTray
      tags: [layout]
      summary: Delete a tray
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tray deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /sensors:
    get:
      operationId: listSensors
      tags: [sensors]
      summary: List sensors
      responses:
        "200":
          description: List of sensors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sensor"
    post:
      operationId: createSensor
      tags: [sensors]
      summary: Register a sensor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensorInput"
      responses:
        "201":
          description: Sensor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sensor"

  /sensors/bulk:
    post:
      operationId: bulkCreateSensors
      tags: [sensors]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkCreateSensorsRequest"
      responses:
        "201":
          description: One sensor row created per (type × placement target)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkCreateSensorsResponse"

  /sensor-readings:
    get:
      operationId: listSensorReadings
      tags: [sensors]
      summary: List sensor readings (history)
      parameters:
        - name: sensorId
          in: query
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: List of readings (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SensorReading"
    post:
      operationId: createSensorReading
      tags: [sensors]
      summary: Ingest a sensor reading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensorReadingInput"
      responses:
        "201":
          description: Reading recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensorReading"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List open tasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_progress, done]
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /crops:
    get:
      operationId: listCrops
      tags: [crops]
      summary: List crops (catalog)
      responses:
        "200":
          description: List of crops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Crop"
    post:
      operationId: createCrop
      tags: [crops]
      summary: Create a crop catalog entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CropInput"
      responses:
        "201":
          description: Crop created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Crop"

  /metrics:
    get:
      operationId: listMetrics
      tags: [metrics]
      summary: Compute the requested Tier-B metrics server-side
      parameters:
        - name: tab
          in: query
          schema: { type: string, enum: [overview, shipments, inventory, accounting] }
        - name: keys
          in: query
          description: Comma-separated metric ids (validated against the registry allowlist).
          schema: { type: string }
        - name: range
          in: query
          schema: { type: string, enum: [7d, 30d, 90d, custom, all] }
      responses:
        "200":
          description: Map of metric id → data ({value} | {label,value}[] | rows[])
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
        "400":
          description: Invalid keys

  /metrics/availability:
    get:
      operationId: getMetricsAvailability
      tags: [metrics]
      summary: Which optional data sources have rows (gates `requires` in the picker)
      responses:
        "200":
          description: Availability flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsAvailability"

  /users/me/settings:
    get:
      operationId: getUserSettings
      tags: [userSettings]
      summary: Get all settings for the signed-in user
      responses:
        "200":
          description: User settings map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettingsResponse"

  /users/me/settings/{key}:
    put:
      operationId: putUserSetting
      tags: [userSettings]
      summary: Upsert one setting for the signed-in user
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingInput"
      responses:
        "200":
          description: Setting saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettingInput"

  /accounting/connect:
    get:
      operationId: getAccountingConnectUri
      tags: [accounting]
      summary: Get the QuickBooks OAuth authorize URL to redirect the user to
      responses:
        "200":
          description: Authorize URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountingConnectResponse"

  /accounting/status:
    get:
      operationId: getAccountingStatus
      tags: [accounting]
      summary: QuickBooks connection status for the signed-in user
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountingStatusResponse"

  /accounting/disconnect:
    post:
      operationId: postAccountingDisconnect
      tags: [accounting]
      summary: Disconnect QuickBooks for the signed-in user
      responses:
        "200":
          description: Disconnect result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountingDisconnectResponse"

  /recommend:
    post:
      operationId: postRecommend
      tags: [recommend]
      summary: Ask the vertical-farming recommender a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendRequest"
      responses:
        "200":
          description: Recommender answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendResponse"

  /facility-logs:
    post:
      operationId: postFacilityLog
      tags: [facilityLogs]
      summary: Create a facility compliance log entry (Alpha App mobile)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityLogRequest"
      responses:
        "201":
          description: Created facility log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityLog"

  /facilities:
    post:
      operationId: createFacility
      tags: [facilities]
      summary: W2 — create organization, facility, and the 3 index-1 rooms in one transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFacilityRequest"
      responses:
        "201":
          description: Facility created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateFacilityResponse"
        "409":
          description: Signed-in user already belongs to a facility

  /facilities/me:
    get:
      operationId: getMyFacility
      tags: [facilities]
      summary: Facility-existence check for the signed-in user (wizard gate)
      responses:
        "200":
          description: The signed-in user's facility, or null if they have none yet
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Facility"
                  - type: "null"

  /wizard/progress:
    get:
      operationId: getWizardProgress
      tags: [wizard]
      summary: Resume support — the signed-in user's current wizard step + saved draft data
      responses:
        "200":
          description: The signed-in user's wizard progress, or null if the wizard hasn't been started yet
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WizardProgress"
                  - type: "null"
    put:
      operationId: putWizardProgress
      tags: [wizard]
      summary: Save the current step's draft data and/or advance currentStep
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutWizardProgressRequest"
      responses:
        "200":
          description: The updated wizard progress row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WizardProgress"

  /sensor-accounts:
    get:
      operationId: listSensorAccounts
      tags: [sensor-accounts]
      summary: List the signed-in user's organization's vendor sensor accounts
      responses:
        "200":
          description: The organization's sensor accounts (never includes credentials)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SensorAccount"
    post:
      operationId: createSensorAccount
      tags: [sensor-accounts]
      summary: Create a vendor sensor account, encrypting the credential at rest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSensorAccountRequest"
      responses:
        "201":
          description: Sensor account created (never returns the credential)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensorAccount"
        "409":
          description: Signed-in user has no facility yet

  /sensor-accounts/{id}/test-connection:
    post:
      operationId: testSensorAccountConnection
      tags: [sensor-accounts]
      summary: >
        Test a vendor sensor account's connection. Falls through to
        pending_integration when no adapter exists yet for the vendor —
        never fakes a successful connection (SEN-003).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensorAccountConnectionResult"
        "404":
          description: Sensor account not found
        "409":
          description: Signed-in user has no facility yet
        "429":
          description: Too many connection tests for this user

  /wizard-events:
    post:
      operationId: postWizardEvent
      tags: [wizard-events]
      summary: WIZ-006 fire-and-forget step telemetry (view/save/abandon/skip)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostWizardEventRequest"
      responses:
        "202":
          description: Event recorded (no response body)
        "429":
          description: Too many telemetry events for this user

  /facility-readiness:
    get:
      operationId: getFacilityReadiness
      tags: [facility-readiness]
      summary: >
        Computed 7-item onboarding "Farm Readiness" checklist (CHK-001..003).
        `completedCount` is always exactly the number of `items` whose
        `state` is "done" — derived from the same array returned in this
        response, never an independently-maintained number.
      responses:
        "200":
          description: The signed-in user's facility readiness checklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityReadinessResponse"
        "409":
          description: Signed-in user has no facility yet

  /facility-readiness/events:
    post:
      operationId: postFacilityReadinessEvent
      tags: [facility-readiness]
      summary: >
        Record (or, with `undo: true`, reverse) a checklist-relevant event.
        Insert-or-update on (facilityId, eventKey) — a re-fired event
        refreshes `occurredAt` / clears `undoneAt` rather than erroring.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordReadinessEventRequest"
      responses:
        "201":
          description: Event recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "200":
          description: Event undone
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "409":
          description: Signed-in user has no facility yet

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    MediaUploadResponse:
      type: object
      properties:
        key:
          type: string
          description: >
            Bucket-relative object key (e.g. "media/a1b2c3d4.jpg") — the
            stable reference to persist as a photo reference.
        url:
          type: string
          description: >
            Signed URL for the just-uploaded key, valid for one hour —
            for immediate display only, not for persisting.
      required: [key, url]

    GrowthProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        seedName:
          type: string
        germinationDays:
          type: integer
        fertigationDays:
          type: integer
      required: [id, name, seedName, germinationDays, fertigationDays]

    SeedLot:
      type: object
      properties:
        id:
          type: integer
        qrCode:
          type: string
        seedName:
          type: string
        supplier:
          type: ["string", "null"]
        productLink:
          type: ["string", "null"]
        itemNumber:
          type: ["string", "null"]
        vendorShort:
          type: ["string", "null"]
        gpcCode:
          type: ["string", "null"]
        type:
          type: ["string", "null"]
        success:
          type: ["string", "null"]
        growTime:
          type: ["string", "null"]
        usedIn:
          type: ["string", "null"]
        currentlyGrown:
          type: ["boolean", "null"]
      required: [id, qrCode, seedName]

    ManualCheck:
      type: object
      properties:
        id:
          type: integer
        cycleId:
          type: integer
        fullTrays:
          type: integer
        halfTrays:
          type: integer
        isBadTrays:
          type: boolean
        issue:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        photoUrls:
          type: array
          items:
            type: string
        createdBy:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, cycleId, fullTrays, halfTrays, isBadTrays, photoUrls, createdAt]

    Cycle:
      type: object
      properties:
        id:
          type: integer
        shortId:
          type: string
        seedLotQrCodes:
          type: array
          items:
            type: string
        seedName:
          type: string
        fullTrays:
          type: integer
        halfTrays:
          type: integer
        seedWeightTray:
          type: number
        growthProfileId:
          type: integer
        growthProfileName:
          type: string
        germinationDays:
          type: integer
        fertigationDays:
          type: integer
        seedingDate:
          type: string
        status:
          type: string
          enum: [germination, fertigation, harvest, completed]
        trayPosition:
          type: ["string", "null"]
        germinationStartedAt:
          type: ["string", "null"]
          format: date-time
        fertigationStartedAt:
          type: ["string", "null"]
          format: date-time
        harvestStartedAt:
          type: ["string", "null"]
          format: date-time
        harvestedQty:
          type: ["number", "null"]
        closedAt:
          type: ["string", "null"]
          format: date-time
        createdBy:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        daysOverdueFertigation:
          type: ["integer", "null"]
        daysOverdueHarvest:
          type: ["integer", "null"]
      required:
        - id
        - shortId
        - seedLotQrCodes
        - seedName
        - fullTrays
        - halfTrays
        - seedWeightTray
        - growthProfileId
        - growthProfileName
        - germinationDays
        - fertigationDays
        - seedingDate
        - status
        - createdAt

    CycleDetail:
      allOf:
        - $ref: "#/components/schemas/Cycle"
        - type: object
          properties:
            manualChecks:
              type: array
              items:
                $ref: "#/components/schemas/ManualCheck"
          required: [manualChecks]

    CreateCycleRequest:
      type: object
      properties:
        seedLotQrCodes:
          type: array
          items:
            type: string
          minItems: 1
        seedName:
          type: string
        fullTrays:
          type: integer
        halfTrays:
          type: integer
        seedWeightTray:
          type: number
        growthProfileId:
          type: integer
        seedingDate:
          type: string
        trayPosition:
          type: string
        humidity:
          type: number
        temperature:
          type: number
        ph:
          type: number
        waterLevel:
          type: number
        nutrientMix:
          type: string
      required:
        - seedLotQrCodes
        - seedName
        - fullTrays
        - halfTrays
        - seedWeightTray
        - growthProfileId
        - seedingDate
        - trayPosition

    MoveFertigationRequest:
      type: object
      properties:
        seedLotQrCode:
          type: string
        humidity:
          type: number
        temperature:
          type: number
        ph:
          type: number
        waterLevel:
          type: number
        nutrientMix:
          type: string
      required: [seedLotQrCode]

    CompleteHarvestRequest:
      type: object
      properties:
        fullTrays:
          type: integer
        halfTrays:
          type: integer
        harvestedQty:
          type: number
        trayQrCode:
          type: string
      required: [fullTrays, halfTrays, harvestedQty, trayQrCode]

    CreateManualCheckRequest:
      type: object
      properties:
        fullTrays:
          type: integer
        halfTrays:
          type: integer
        isBadTrays:
          type: boolean
        issue:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        photoUrls:
          type: array
          items:
            type: string
      required: [fullTrays, halfTrays, isBadTrays, photoUrls]

    SensorStatus:
      type: object
      description: Sourced from the real per-channel-linked sensors/sensor_readings tables (Phase 7), not a legacy flat singleton row. Each metric's *Error flag is true when no sensor of that type exists or its last reading is stale (>15min).
      properties:
        sensorsOnline:
          type: integer
        sensorsTotal:
          type: integer
        acidityPh:
          type: ["number", "null"]
        acidityPhError:
          type: boolean
        waterLevelPct:
          type: ["number", "null"]
        waterLevelPctError:
          type: boolean
        tempCelsius:
          type: ["number", "null"]
        tempCelsiusError:
          type: boolean
        humidityPct:
          type: ["number", "null"]
        humidityPctError:
          type: boolean
      required: [sensorsOnline, sensorsTotal, acidityPh, acidityPhError, waterLevelPct, waterLevelPctError, tempCelsius, tempCelsiusError, humidityPct, humidityPctError]

    DashboardStats:
      type: object
      properties:
        channelUtilization:
          type: number
        totalRunningCycles:
          type: integer
        totalChannels:
          type: integer
        totalYieldThisWeek:
          type: number
        totalYieldThisMonth:
          type: number
        totalWasteThisWeek:
          type: number
          description: SUM(bad_tray_entries.lossEstimate) this week, grams — wastage-aware estimate grounded in each cycle's growth-profile expected yield.
        activeSeedLots:
          type: integer
        badTraysCount:
          type: integer
        activeCropTypes:
          type: integer
          description: Count of distinct crop/seed names in running cycles.
        totalBadTrays:
          type: integer
        yieldByDay:
          type: array
          items:
            $ref: "#/components/schemas/ChartDataPoint"
        yieldByWeek:
          type: array
          items:
            $ref: "#/components/schemas/ChartDataPoint"
        seedingByDay:
          type: array
          items:
            $ref: "#/components/schemas/ChartDataPoint"
        seedingByWeek:
          type: array
          items:
            $ref: "#/components/schemas/ChartDataPoint"
        badTrayByDay:
          type: array
          items:
            $ref: "#/components/schemas/ChartDataPoint"
        badTrayByWeek:
          type: array
          items:
            $ref: "#/components/schemas/ChartDataPoint"
        actionRequired:
          type: array
          items:
            $ref: "#/components/schemas/ActionRequiredItem"
        sensorStatus:
          $ref: "#/components/schemas/SensorStatus"
      required:
        - channelUtilization
        - totalRunningCycles
        - totalChannels
        - totalYieldThisWeek
        - totalYieldThisMonth
        - totalWasteThisWeek
        - activeSeedLots
        - badTraysCount
        - activeCropTypes
        - totalBadTrays
        - actionRequired

    ChartDataPoint:
      type: object
      properties:
        label:
          type: string
        value:
          type: number
      required: [label, value]

    MetricSeriesPoint:
      type: object
      properties:
        label:
          type: string
        value:
          type: number
      required: [label, value]

    MetricsResponse:
      type: object
      description: Map of metric id → its computed data. Values are either a
        scalar {value:number}, a series MetricSeriesPoint[], or a row object[]
        (for table templates). The dashboard casts per metric id.
      additionalProperties: true

    MetricsAvailability:
      type: object
      properties:
        revenue:
          type: boolean
        sensor_readings:
          type: boolean
        cost:
          type: boolean
        crop_id:
          type: boolean
        accounting_connected:
          type: boolean
          description: Whether the signed-in user has an active QuickBooks connection.
      required: [revenue, sensor_readings, cost, crop_id, accounting_connected]

    UserSettingsResponse:
      type: object
      properties:
        settings:
          type: object
          description: Map of setting key -> arbitrary JSON value.
          additionalProperties: true
      required: [settings]

    UserSettingInput:
      type: object
      properties:
        value:
          description: Arbitrary JSON value to store for this key.
      required: [value]

    AccountingConnectResponse:
      type: object
      properties:
        authorizeUri:
          type: string
      required: [authorizeUri]

    AccountingStatusResponse:
      type: object
      properties:
        connected:
          type: boolean
        realmId:
          type: string
        companyName:
          type: string
          nullable: true
        environment:
          type: string
      required: [connected]

    AccountingDisconnectResponse:
      type: object
      properties:
        disconnected:
          type: boolean
      required: [disconnected]

    RecommendRequest:
      type: object
      properties:
        question:
          type: string
      required: [question]

    RecommendSource:
      type: object
      properties:
        title:
          type: string
          nullable: true
        url:
          type: string
        similarity:
          type: number
      required: [url, similarity]

    RecommendResponse:
      type: object
      properties:
        answer:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/RecommendSource"
        cache_hit:
          type: boolean
      required: [answer, sources, cache_hit]

    FacilityLogRequest:
      type: object
      properties:
        logType:
          type: string
          enum: [maintenance, waste, env_check, cleaning, receiving, visitor]
        data:
          type: object
          additionalProperties: true
        notes:
          type: string
      required: [logType, data]

    FacilityLog:
      type: object
      properties:
        id:
          type: integer
        logType:
          type: string
          enum: [maintenance, waste, env_check, cleaning, receiving, visitor]
        data:
          type: object
          additionalProperties: true
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, logType, data, createdAt]

    CreateFacilityRequest:
      type: object
      required: [farmName, timezone, units, currency]
      properties:
        farmName: { type: string, minLength: 1 }
        facilityName: { type: string, minLength: 1 }
        timezone: { type: string }
        units: { type: string, enum: [metric, imperial] }
        currency: { type: string, minLength: 3, maxLength: 3 }

    CreateFacilityResponse:
      type: object
      properties:
        facilityId: { type: integer }
        organizationId: { type: integer }
      required: [facilityId, organizationId]

    Facility:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        organizationId:
          type: integer
        facilityName:
          type: string
        timezone:
          type: string
        units:
          type: string
          enum: [metric, imperial]
        currency:
          type: string
      required: [id, name, organizationId, facilityName, timezone, units, currency]

    WizardProgress:
      type: object
      properties:
        currentStep:
          type: string
          enum: [farm_basics, layout, sensors_accounts, sensors_devices, sensors_review, done]
        stepData:
          type: object
          additionalProperties: true
      required: [currentStep, stepData]

    PutWizardProgressRequest:
      type: object
      properties:
        currentStep:
          type: string
          enum: [farm_basics, layout, sensors_accounts, sensors_devices, sensors_review, done]
        stepData:
          type: object
          additionalProperties: true
      required: [currentStep]

    PostWizardEventRequest:
      type: object
      required: [step, eventType]
      properties:
        step:
          type: string
          enum: [farm_basics, layout, sensors_accounts, sensors_devices, sensors_review, done]
        eventType:
          type: string
          enum: [view, save, abandon, skip]

    CreateSensorAccountRequest:
      type: object
      required: [vendor, authMethod, credential]
      properties:
        vendor: { type: string, minLength: 1 }
        authMethod: { type: string, enum: [api_key, oauth, username_password] }
        credential:
          type: string
          minLength: 1
          description: >
            API key, or JSON-stringified username/password — encrypted
            before storage, never persisted or returned in plaintext.

    SensorAccount:
      type: object
      description: >
        Vendor sensor account, deliberately excluding credentialCiphertext —
        the handler explicitly selects columns rather than select-all
        (SEN-002) so credentials can never leak into a response.
      properties:
        id:
          type: integer
        vendor:
          type: string
        authMethod:
          type: string
          enum: [api_key, oauth, username_password]
        status:
          type: string
          enum: [connected, failed, pending_integration]
        maskedFingerprint:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, vendor, authMethod, status, maskedFingerprint]

    SensorAccountConnectionResult:
      type: object
      properties:
        status:
          type: string
